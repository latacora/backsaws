name: Continuous Delivery

on: push

jobs:
  test:
    # GitHub retired ubuntu-20.04, and a job asking for a retired label sits queued until
    # GitHub cancels it, which is why every run here since September 2025 is `cancelled`
    # rather than failed — including the ones behind merged pull requests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Clojure tools
        uses: DeLaGuardo/setup-clojure@02f5a82b79a547523e664fe8a7a32ea14884d7b2 # 13.6.0
        with:
          cli: 1.12.5.1664
          github-token: ${{ secrets.GITHUB_TOKEN }}  # To avoid rate limit errors
      - name: Cache Dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gitlibs
            ~/.m2/repository
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-deps-
      - run: bin/test
